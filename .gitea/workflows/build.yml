name: Build mmkv_c

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux static package
    runs-on: linux
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: token ${{ github.token }}" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD
          git submodule sync -- MMKV
          git submodule update --init MMKV

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v python3 >/dev/null 2>&1; then
            echo "python3 is required on the Linux runner" >&2
            exit 1
          fi

          python_venv="$HOME/.cache/mmkv-ci/python"
          rm -rf "$python_venv"
          if python3 -m venv "$python_venv" >/dev/null 2>&1; then
            "$python_venv/bin/python" -m pip install --upgrade pip conan cmake
            echo "$python_venv/bin" >> "$GITHUB_PATH"
            export PATH="$python_venv/bin:$PATH"
          else
            user_base="$(python3 -m site --user-base)"
            python3 -m pip install --user --upgrade pip conan cmake --break-system-packages || \
              python3 -m pip install --user --upgrade pip conan cmake
            echo "$user_base/bin" >> "$GITHUB_PATH"
            export PATH="$user_base/bin:$PATH"
          fi

          if ! command -v c++ >/dev/null 2>&1; then
            echo "A C++ compiler is required on the Linux runner" >&2
            exit 1
          fi

          c++ --version
          cmake --version
          conan --version

      - name: Tool versions
        run: |
          export PATH="$HOME/.cache/mmkv-ci/python/bin:$PATH"
          cmake --version
          conan --version

      - name: Configure Conan profile
        run: |
          export PATH="$HOME/.cache/mmkv-ci/python/bin:$PATH"
          export CONAN_HOME="$PWD/.conan2"
          conan profile detect --force

      - name: CMake smoke tests
        run: |
          export PATH="$HOME/.cache/mmkv-ci/python/bin:$PATH"
          export CONAN_HOME="$PWD/.conan2"
          rm -rf build
          cmake -S . -B build \
            -DMMKV_C_BUILD_TESTS=ON \
            -DMMKV_C_FORCE_POSIX=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Conan create
        run: |
          export PATH="$HOME/.cache/mmkv-ci/python/bin:$PATH"
          export CONAN_HOME="$PWD/.conan2"
          conan create . --build=missing -s build_type=Release -nr

      - name: Upload Conan package
        env:
          CONAN_REMOTE_NAME: private
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          MMKV_C_REFERENCE: mmkv_c/2.4.0
        run: |
          export PATH="$HOME/.cache/mmkv-ci/python/bin:$PATH"
          export CONAN_HOME="$PWD/.conan2"

          should_upload=no
          case "${GITHUB_EVENT_NAME:-}" in
            workflow_dispatch) should_upload=yes ;;
            *) case "${GITHUB_REF:-}" in refs/tags/v*) should_upload=yes ;; esac ;;
          esac
          if [ "$should_upload" != "yes" ]; then
            echo "Skipping Conan upload for ${GITHUB_EVENT_NAME:-unknown} ${GITHUB_REF:-unknown}"
            exit 0
          fi

          remote_name="${CONAN_REMOTE_NAME:-private}"
          remote_url="${CONAN_REMOTE_URL:-}"
          username="${CONAN_USERNAME:-}"
          password="${CONAN_PASSWORD:-}"

          if [ -z "$remote_url" ]; then
            echo "CONAN_REMOTE_URL secret is required for Conan upload" >&2
            exit 1
          fi
          if [ -z "$username" ] || [ -z "$password" ]; then
            echo "CONAN_USERNAME and CONAN_PASSWORD secrets are required for Conan upload" >&2
            exit 1
          fi

          conan remote add "$remote_name" "$remote_url" -f
          conan remote login "$remote_name" "$username" -p "$password"
          conan upload "${MMKV_C_REFERENCE}:*" -r "$remote_name" --check -c

  windows:
    name: Windows static package
    runs-on: windows
    steps:
      - name: Checkout
        shell: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([System.IO.File]::ReadAllText('{0}')); if ($null -ne $LASTEXITCODE) { exit $LASTEXITCODE }"
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: token ${{ github.token }}" fetch --depth=1 origin "$env:GITHUB_SHA"
          git checkout --force FETCH_HEAD
          git submodule sync -- MMKV
          git submodule update --init MMKV

      - name: Install toolchain
        shell: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([System.IO.File]::ReadAllText('{0}')); if ($null -ne $LASTEXITCODE) { exit $LASTEXITCODE }"
        run: |
          $ErrorActionPreference = "Stop"
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false

          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $tempDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
            $installer = Join-Path $tempDir "python-3.11-installer.exe"
            Invoke-WebRequest -UseBasicParsing -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe" -OutFile $installer
            & $installer /quiet InstallAllUsers=0 PrependPath=1 Include_test=0
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $pythonRoot = Join-Path $env:LOCALAPPDATA "Programs\Python\Python311"
            $pythonScripts = Join-Path $pythonRoot "Scripts"
            [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$pythonRoot`n", $utf8NoBom)
            [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$pythonScripts`n", $utf8NoBom)
            $env:PATH = "$pythonRoot;$pythonScripts;$env:PATH"
          }

          $pythonCommand = Get-Command python
          $pythonRoot = Split-Path $pythonCommand.Source
          $pythonScripts = Join-Path $pythonRoot "Scripts"
          $userScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts', scheme='nt_user'))"
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$pythonRoot`n", $utf8NoBom)
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$pythonScripts`n", $utf8NoBom)
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$userScripts`n", $utf8NoBom)
          $env:PATH = "$pythonRoot;$pythonScripts;$userScripts;$env:PATH"

          python --version
          python -m pip install --user --upgrade pip conan cmake --no-warn-script-location
          cmake --version
          conan --version

      - name: Tool versions
        shell: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([System.IO.File]::ReadAllText('{0}')); if ($null -ne $LASTEXITCODE) { exit $LASTEXITCODE }"
        run: |
          cmake --version
          conan --version

      - name: Configure Conan profile
        shell: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([System.IO.File]::ReadAllText('{0}')); if ($null -ne $LASTEXITCODE) { exit $LASTEXITCODE }"
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          conan profile detect --force

      - name: CMake smoke tests
        shell: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([System.IO.File]::ReadAllText('{0}')); if ($null -ne $LASTEXITCODE) { exit $LASTEXITCODE }"
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DMMKV_C_BUILD_TESTS=ON `
            -DMMKV_C_FORCE_POSIX=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Conan create
        shell: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([System.IO.File]::ReadAllText('{0}')); if ($null -ne $LASTEXITCODE) { exit $LASTEXITCODE }"
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          conan create . --build=missing -s build_type=Release -nr

      - name: Upload Conan package
        shell: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([System.IO.File]::ReadAllText('{0}')); if ($null -ne $LASTEXITCODE) { exit $LASTEXITCODE }"
        env:
          CONAN_REMOTE_NAME: private
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          MMKV_C_REFERENCE: mmkv_c/2.4.0
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"

          $shouldUpload = $false
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $shouldUpload = $true
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $shouldUpload = $true
          }
          if (-not $shouldUpload) {
            Write-Host "Skipping Conan upload for $env:GITHUB_EVENT_NAME $env:GITHUB_REF"
            exit 0
          }

          $remoteName = if ($env:CONAN_REMOTE_NAME) { $env:CONAN_REMOTE_NAME } else { "private" }
          $remoteUrl = $env:CONAN_REMOTE_URL
          $username = $env:CONAN_USERNAME
          $password = $env:CONAN_PASSWORD

          if (-not $remoteUrl) {
            throw "CONAN_REMOTE_URL secret is required for Conan upload"
          }
          if (-not $username -or -not $password) {
            throw "CONAN_USERNAME and CONAN_PASSWORD secrets are required for Conan upload"
          }

          conan remote add $remoteName $remoteUrl -f
          conan remote login $remoteName $username -p $password
          conan upload "$($env:MMKV_C_REFERENCE):*" -r $remoteName --check -c
