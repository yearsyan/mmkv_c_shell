name: Build mmkv_c

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux static package
    runs-on: linux
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: token ${{ github.token }}" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD
          git submodule sync -- MMKV
          git submodule update --init MMKV

      - name: Tool versions
        run: |
          cmake --version
          conan --version

      - name: Configure Conan profile
        run: |
          export CONAN_HOME="$PWD/.conan2"
          conan profile detect --force

      - name: CMake smoke tests
        run: |
          export CONAN_HOME="$PWD/.conan2"
          rm -rf build
          cmake -S . -B build \
            -DMMKV_C_BUILD_TESTS=ON \
            -DMMKV_C_FORCE_POSIX=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Conan create
        run: |
          export CONAN_HOME="$PWD/.conan2"
          conan create . --build=missing -s build_type=Release

  windows:
    name: Windows static package
    runs-on: windows
    steps:
      - name: Checkout
        shell: powershell
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: token ${{ github.token }}" fetch --depth=1 origin "$env:GITHUB_SHA"
          git checkout --force FETCH_HEAD
          git submodule sync -- MMKV
          git submodule update --init MMKV

      - name: Tool versions
        shell: powershell
        run: |
          cmake --version
          conan --version

      - name: Configure Conan profile
        shell: powershell
        run: |
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          conan profile detect --force

      - name: CMake smoke tests
        shell: powershell
        run: |
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DMMKV_C_BUILD_TESTS=ON `
            -DMMKV_C_FORCE_POSIX=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Conan create
        shell: powershell
        run: |
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          conan create . --build=missing -s build_type=Release
