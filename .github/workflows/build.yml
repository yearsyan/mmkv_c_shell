name: Build mmkv_c

on:
  push:
    tags:
      - "v**"

env:
  CONAN_REMOTE_NAME: private
  MMKV_C_REFERENCE: mmkv_c/2.4.0

jobs:
  linux:
    name: Linux static package
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip conan cmake
          c++ --version
          cmake --version
          conan --version

      - name: Configure Conan profile
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          conan profile detect --force

      - name: CMake smoke tests
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          cmake -S . -B build \
            -DMMKV_C_BUILD_TESTS=ON \
            -DMMKV_C_FORCE_POSIX=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Conan create
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          conan create . --build=missing -s build_type=Release -nr

      - name: Upload Conan package
        shell: bash
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          CONAN_HTTPS_PROXY_URL: ${{ secrets.CONAN_HTTPS_PROXY_URL }}
          CONAN_HTTPS_PROXY_USERNAME: ${{ secrets.CONAN_HTTPS_PROXY_USERNAME }}
          CONAN_HTTPS_PROXY_PASSWORD: ${{ secrets.CONAN_HTTPS_PROXY_PASSWORD }}
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          bash tools/ci_upload_conan.sh

  android:
    name: Android arm64 static package
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "28.1.13356709"
    steps:
      - name: Configure Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip conan cmake
          cmake --version
          conan --version

      - name: Prepare Android NDK
        shell: bash
        run: |
          set -euo pipefail
          android_home="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$android_home" ]; then
            echo "Android SDK is required on the Linux runner" >&2
            exit 1
          fi

          sdkmanager="$android_home/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(command -v sdkmanager || true)"
          fi
          if [ -z "$sdkmanager" ] || [ ! -x "$sdkmanager" ]; then
            echo "sdkmanager is required to prepare the Android NDK" >&2
            exit 1
          fi

          ndk_path="$android_home/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk_path" ]; then
            yes | "$sdkmanager" --licenses >/dev/null || true
            "$sdkmanager" "ndk;$ANDROID_NDK_VERSION"
          fi

          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"

      - name: Configure Conan profile
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          conan profile detect --force

      - name: Conan create
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          mkdir -p profiles
          cat > profiles/android-arm64 <<EOF
          [settings]
          os=Android
          os.api_level=23
          arch=armv8
          compiler=clang
          compiler.version=19
          compiler.libcxx=c++_static
          compiler.cppstd=20
          build_type=Release

          [conf]
          tools.android:ndk_path=$ANDROID_NDK_HOME
          EOF
          conan create . --build=missing -pr:b default -pr:h profiles/android-arm64 -nr

      - name: Upload Conan package
        shell: bash
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          CONAN_HTTPS_PROXY_URL: ${{ secrets.CONAN_HTTPS_PROXY_URL }}
          CONAN_HTTPS_PROXY_USERNAME: ${{ secrets.CONAN_HTTPS_PROXY_USERNAME }}
          CONAN_HTTPS_PROXY_PASSWORD: ${{ secrets.CONAN_HTTPS_PROXY_PASSWORD }}
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          bash tools/ci_upload_conan.sh

  macos:
    name: macOS arm64 static package
    runs-on: macos-15
    steps:
      - name: Configure Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip conan cmake
          c++ --version
          cmake --version
          conan --version

      - name: Configure Conan profile
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          conan profile detect --force

      - name: CMake smoke tests
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          cmake -S . -B build \
            -DMMKV_C_BUILD_TESTS=ON \
            -DMMKV_C_FORCE_POSIX=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Conan create
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          conan create . --build=missing -s build_type=Release -nr

      - name: Upload Conan package
        shell: bash
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          CONAN_HTTPS_PROXY_URL: ${{ secrets.CONAN_HTTPS_PROXY_URL }}
          CONAN_HTTPS_PROXY_USERNAME: ${{ secrets.CONAN_HTTPS_PROXY_USERNAME }}
          CONAN_HTTPS_PROXY_PASSWORD: ${{ secrets.CONAN_HTTPS_PROXY_PASSWORD }}
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          bash tools/ci_upload_conan.sh

  ios:
    name: iOS arm64 static package
    runs-on: macos-15
    steps:
      - name: Configure Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip conan cmake
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          cmake --version
          conan --version

      - name: Configure Conan profile
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          conan profile detect --force

      - name: Conan create
        shell: bash
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          compiler_version="$(awk -F= '/^compiler.version=/{ print $2; exit }' "$CONAN_HOME/profiles/default")"
          if [ -z "$compiler_version" ]; then
            echo "Unable to read apple-clang version from Conan profile" >&2
            exit 1
          fi

          ios_sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p profiles
          cat > profiles/ios-arm64 <<EOF
          [settings]
          os=iOS
          os.version=13.0
          os.sdk=iphoneos
          arch=armv8
          compiler=apple-clang
          compiler.version=$compiler_version
          compiler.libcxx=libc++
          compiler.cppstd=20
          build_type=Release

          [conf]
          tools.apple:sdk_path=$ios_sdk_path
          EOF
          conan create . --build=missing -pr:b default -pr:h profiles/ios-arm64 -nr

      - name: Upload Conan package
        shell: bash
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          CONAN_HTTPS_PROXY_URL: ${{ secrets.CONAN_HTTPS_PROXY_URL }}
          CONAN_HTTPS_PROXY_USERNAME: ${{ secrets.CONAN_HTTPS_PROXY_USERNAME }}
          CONAN_HTTPS_PROXY_PASSWORD: ${{ secrets.CONAN_HTTPS_PROXY_PASSWORD }}
        run: |
          set -euo pipefail
          export CONAN_HOME="$PWD/.conan2"
          bash tools/ci_upload_conan.sh

  windows:
    name: Windows static package
    runs-on: windows-latest
    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip conan cmake
          cmake --version
          conan --version

      - name: Configure Conan profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          conan profile detect --force

      - name: CMake smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DMMKV_C_BUILD_TESTS=ON `
            -DMMKV_C_FORCE_POSIX=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Conan create
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"
          conan create . --build=missing -s build_type=Release -nr

      - name: Upload Conan package
        shell: pwsh
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
          CONAN_HTTPS_PROXY_URL: ${{ secrets.CONAN_HTTPS_PROXY_URL }}
          CONAN_HTTPS_PROXY_USERNAME: ${{ secrets.CONAN_HTTPS_PROXY_USERNAME }}
          CONAN_HTTPS_PROXY_PASSWORD: ${{ secrets.CONAN_HTTPS_PROXY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONAN_HOME = Join-Path (Get-Location) ".conan2"

          $remoteName = if ($env:CONAN_REMOTE_NAME) { $env:CONAN_REMOTE_NAME } else { "private" }
          $remoteUrl = $env:CONAN_REMOTE_URL
          $username = $env:CONAN_USERNAME
          $password = $env:CONAN_PASSWORD
          $proxyUrl = $env:CONAN_HTTPS_PROXY_URL
          $proxyUsername = $env:CONAN_HTTPS_PROXY_USERNAME
          $proxyPassword = $env:CONAN_HTTPS_PROXY_PASSWORD

          if (-not $remoteUrl) {
            throw "CONAN_REMOTE_URL secret is required for Conan upload"
          }
          if (-not $username -or -not $password) {
            throw "CONAN_USERNAME and CONAN_PASSWORD secrets are required for Conan upload"
          }
          if (-not $proxyUrl -or -not $proxyUsername -or -not $proxyPassword) {
            throw "CONAN_HTTPS_PROXY_URL, CONAN_HTTPS_PROXY_USERNAME, and CONAN_HTTPS_PROXY_PASSWORD secrets are required for Conan upload"
          }

          $proxyUri = [System.Uri]$proxyUrl
          if (-not $proxyUri.Scheme -or -not $proxyUri.Host) {
            throw "CONAN_HTTPS_PROXY_URL must include scheme and host"
          }
          $proxyHost = $proxyUri.Host
          if ($proxyHost.Contains(":") -and -not $proxyHost.StartsWith("[")) {
            $proxyHost = "[$proxyHost]"
          }
          $proxyPort = if ($proxyUri.IsDefaultPort) { "" } else { ":$($proxyUri.Port)" }
          $proxyWithAuth = "{0}://{1}:{2}@{3}{4}{5}" -f `
            $proxyUri.Scheme, `
            [System.Uri]::EscapeDataString($proxyUsername), `
            [System.Uri]::EscapeDataString($proxyPassword), `
            $proxyHost, `
            $proxyPort, `
            $proxyUri.PathAndQuery
          Write-Output "::add-mask::$proxyWithAuth"
          $env:HTTPS_PROXY = $proxyWithAuth
          $env:https_proxy = $proxyWithAuth

          conan remote add $remoteName $remoteUrl -f
          conan remote login $remoteName $username -p $password
          conan upload "$($env:MMKV_C_REFERENCE):*" -r $remoteName --check -c
